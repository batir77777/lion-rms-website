<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Savings Calculator — Lion RMS</title>
  <meta name="description" content="Find out how many hours and how much money your business could save by automating admin with AI. Instant estimate. No sign-up required."/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #0a1628; background: #f8fafc; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    :root {
      --navy: #0a1628; --navy-mid: #0d2040; --teal: #00c9a7; --teal-dark: #00a389;
      --slate: #64748b; --light: #f8fafc; --border: #e2e8f0; --white: #fff;
      --red: #ef4444; --green: #10b981;
    }

    /* NAV */
    nav { position:fixed; top:0; left:0; right:0; z-index:100; background:rgba(10,22,40,.92); backdrop-filter:blur(12px); border-bottom: 1px solid rgba(255,255,255,.08); }
    .nav-inner { max-width: 1160px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { display:flex; align-items:center; }
    .nav-logo img { height:44px; width:auto; }
    .nav-links { display:flex; align-items:center; gap:4px; }
    .nav-links a { font-size:14px; font-weight:500; color:rgba(255,255,255,.75); padding:8px 14px; border-radius:8px; text-decoration:none; transition:color .2s,background .2s; }
    .nav-links a:hover { color:#fff; background:rgba(255,255,255,.08); }
    .nav-links a.active { color:var(--teal); }
    .nav-links a.nav-highlight { color:var(--teal) !important; font-weight:700; }
    .nav-cta { background:var(--teal); color:var(--navy) !important; padding:9px 20px; border-radius:50px; font-size:14px; font-weight:700; transition:transform .2s,background .2s; }
    .nav-cta:hover { background:var(--teal-dark); transform:translateY(-1px); }
    /* ── Mobile nav ── */
    .nav-hamburger { display:none; flex-direction:column; gap:5px; cursor:pointer; padding:8px; border:none; background:none; }
    .nav-hamburger span { display:block; width:22px; height:2.5px; background:#fff; border-radius:2px; transition:all .3s ease; }
    .nav-hamburger.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
    .nav-hamburger.open span:nth-child(2) { opacity:0; transform:scaleX(0); }
    .nav-hamburger.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
    .mobile-menu { position:fixed; top:68px; left:0; right:0; background:rgba(8,18,34,.98); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,.08); z-index:99; padding:4px 0 16px; display:none; box-shadow:0 8px 32px rgba(0,0,0,.4); }
    .mobile-menu.open { display:block; animation:slideDown .2s ease; }
    @keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
    .mobile-menu ul { list-style:none; padding:0; margin:0 0 12px; }
    .mobile-menu ul li a { display:flex; align-items:center; gap:10px; padding:15px 24px; font-size:16px; font-weight:500; color:rgba(255,255,255,.75); border-bottom:1px solid rgba(255,255,255,.05); text-decoration:none; transition:color .15s,background .15s; }
    .mobile-menu ul li:last-child a { border-bottom:none; }
    .mobile-menu ul li a:hover, .mobile-menu ul li a.active { color:#00c9a7; background:rgba(0,201,167,.04); }
    .mobile-menu ul li a.nav-hi { color:#00c9a7 !important; font-weight:700; }
    .mobile-menu .mob-cta { display:block; background:#00c9a7; color:#0a1628 !important; text-align:center; padding:14px 24px; border-radius:50px; font-size:15px; font-weight:700; margin:0 24px; text-decoration:none; transition:background .2s; }
    .mobile-menu .mob-cta:hover { background:#00a889; }
    @media (max-width:768px) {
      .nav-links { display:none !important; }
      .nav-cta { display:none !important; }
      .nav-hamburger { display:flex !important; }
    }

    /* PAGE HEADER */
    .page-head { background: var(--navy); padding: 72px 0 64px; text-align: center;
      background-image: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(0,201,167,.08) 0%, transparent 70%); }
    .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); background: rgba(0,201,167,.12); border: 1px solid rgba(0,201,167,.3); padding: 5px 12px; border-radius: 20px; margin-bottom: 16px; }
    .eyebrow::before { content: '●'; font-size: 8px; }
    .page-head h1 { font-size: clamp(28px, 4vw, 48px); font-weight: 900; color: #fff; margin-bottom: 12px; letter-spacing: -1px; line-height: 1.1; }
    .page-head h1 span { color: var(--teal); }
    .page-head p { font-size: 17px; color: rgba(255,255,255,.6); max-width: 520px; margin: 0 auto; }

    /* MAIN LAYOUT */
    .calc-wrap { max-width: 1100px; margin: 0 auto; padding: 48px 24px 96px; display: grid; grid-template-columns: 1fr 400px; gap: 32px; align-items: start; }

    /* CALCULATOR PANEL */
    .calc-panel { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 36px; }
    .calc-panel h2 { font-size: 20px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
    .calc-panel .subtitle { font-size: 14px; color: var(--slate); margin-bottom: 32px; }

    .field-group { margin-bottom: 28px; }
    .field-group label { display: block; font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
    .field-group .hint { font-size: 12px; color: var(--slate); margin-bottom: 8px; }
    .field-group input[type="range"] { width: 100%; -webkit-appearance: none; height: 6px; background: var(--border); border-radius: 3px; outline: none; transition: .2s; margin-bottom: 4px; }
    .field-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--teal); cursor: pointer; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,201,167,.4); }
    .field-value { text-align: right; font-size: 22px; font-weight: 900; color: var(--teal); }
    .field-value span { font-size: 13px; font-weight: 500; color: var(--slate); }

    .select-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .select-opt { padding: 10px 14px; border: 2px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--slate); cursor: pointer; transition: all .2s; text-align: center; }
    .select-opt:hover { border-color: var(--teal); color: var(--navy); }
    .select-opt.selected { border-color: var(--teal); background: rgba(0,201,167,.08); color: var(--navy); }

    .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .check-opt { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 2px solid var(--border); border-radius: 10px; cursor: pointer; transition: all .2s; }
    .check-opt:hover { border-color: var(--teal); }
    .check-opt.selected { border-color: var(--teal); background: rgba(0,201,167,.06); }
    .check-opt .icon { font-size: 16px; flex-shrink: 0; }
    .check-opt .txt { font-size: 12px; font-weight: 600; color: var(--navy); line-height: 1.3; }
    .check-opt input { display: none; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

    .calc-btn { width: 100%; padding: 16px; background: var(--teal); color: var(--navy); border: none; border-radius: 50px; font-size: 16px; font-weight: 800; cursor: pointer; transition: all .2s; margin-top: 8px; }
    .calc-btn:hover { background: var(--teal-dark); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,201,167,.3); }

    /* RESULTS PANEL */
    .results-panel { display: flex; flex-direction: column; gap: 16px; }
    .result-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
    .result-card.highlight { background: var(--navy); border-color: transparent; }
    .result-card h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 20px; }
    .result-card.highlight h3 { color: rgba(255,255,255,.5); }
    .result-card:not(.highlight) h3 { color: var(--slate); }

    .big-result { margin-bottom: 20px; }
    .big-result .num { font-size: 48px; font-weight: 900; color: var(--teal); line-height: 1; }
    .big-result .label { font-size: 14px; color: rgba(255,255,255,.5); margin-top: 4px; }

    .result-rows { display: flex; flex-direction: column; gap: 12px; }
    .result-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: rgba(255,255,255,.05); border-radius: 9px; }
    .result-row .rr-label { font-size: 13px; color: rgba(255,255,255,.6); }
    .result-row .rr-val { font-size: 15px; font-weight: 800; color: #fff; }
    .result-row .rr-val.teal { color: var(--teal); }

    .secondary-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .secondary-row:last-child { border-bottom: none; }
    .secondary-row .s-label { font-size: 13px; color: var(--slate); }
    .secondary-row .s-val { font-size: 13px; font-weight: 700; color: var(--navy); }

    .badge-saving { background: rgba(16,185,129,.1); color: var(--green); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; }

    .cta-card { background: linear-gradient(135deg, var(--navy) 0%, #0d2040 100%); border-radius: 14px; padding: 28px; text-align: center; border: 1px solid rgba(0,201,167,.2); }
    .cta-card h3 { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .cta-card p { font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 20px; line-height: 1.6; }
    .cta-card a { display: block; padding: 13px 20px; background: var(--teal); color: var(--navy); border-radius: 50px; font-size: 14px; font-weight: 800; text-align: center; transition: all .2s; margin-bottom: 10px; }
    .cta-card a:hover { background: var(--teal-dark); }
    .cta-card .alt-link { display: block; font-size: 12px; color: rgba(255,255,255,.35); }

    /* ASSUMPTIONS / DISCLAIMER */
    .assumptions { font-size: 11px; color: var(--slate); line-height: 1.7; margin-top: 12px; padding: 16px; background: var(--light); border-radius: 10px; border: 1px solid var(--border); }
    .assumptions strong { color: var(--navy); }

    /* PULSE ANIMATION FOR NEW RESULTS */
    @keyframes pulse-in { 0%{transform:scale(.97);opacity:.7} 100%{transform:scale(1);opacity:1} }
    .updating { animation: pulse-in .3s ease; }

    @media(max-width:900px){
      .calc-wrap { grid-template-columns: 1fr; }
      .results-panel { order: -1; }
      .checkbox-grid, .select-group { grid-template-columns: 1fr 1fr; }
    }
    @media(max-width:500px){
      .checkbox-grid { grid-template-columns: 1fr; }
      .calc-panel { padding: 24px; }
    }
  </style>
</head>
